<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Attendly</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 30%, #1e1b4b, #0f172a, #020617);
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-app-region: drag;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 40px;
      max-width: 440px;
    }
    .logo-badge {
      width: 80px;
      height: 80px;
      background: #0A0E17;
      border: 1px solid rgba(59, 130, 246, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 30px -5px rgba(37, 99, 235, 0.35);
      animation: pulse 2.5s infinite;
      overflow: hidden;
      padding: 6px;
    }
    .logo-badge img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 14px;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.35); }
      50% { transform: scale(1.04); box-shadow: 0 15px 35px -5px rgba(37, 99, 235, 0.55); }
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    p {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .progress-bar {
      width: 100%;
      height: 4px;
      background: #1e293b;
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      border-radius: 9999px;
      width: 35%;
      position: absolute;
      animation: indeterminate 1.8s infinite ease-in-out;
    }
    @keyframes indeterminate {
      0% { left: -35%; width: 35%; }
      50% { left: 40%; width: 45%; }
      100% { left: 100%; width: 35%; }
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      margin-top: 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <img src="../public/emblem.png" alt="Attendly" onerror="this.style.display='none'; this.parentElement.innerText='🎓';" />
    </div>
    <h1>Attendly</h1>
    <p>Desktop Edition · Initializing server & security engine</p>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
    <div id="status" class="status-text">Starting server on port 3000…</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer?.on('status-update', (event, message) => {
      const el = document.getElementById('status');
      if (el) el.innerText = message;
    });
  </script>
</body>
</html>
