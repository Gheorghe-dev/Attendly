# ==============================================================================
# Attendly — Nginx Reverse Proxy & High-Performance Installer Hosting
# ==============================================================================

# WebSocket connection upgrade mapping for QR live attendance stream
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Resolve upstream container or local standalone process
upstream attendly_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # Fallback for docker-compose multi-container network
    server attendly:3000 backup;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Maximum upload size (e.g. for student rosters, Excel sheets, materials)
    client_max_body_size 500M;

    # Performance optimizations for static & media transfers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # --------------------------------------------------------------------------
    # 1. High-Performance Desktop Installer File Hosting
    # --------------------------------------------------------------------------
    # Serves .exe, .dmg, .AppImage, .deb, and install scripts directly from disk
    # Supports HTTP Range headers for resumable downloads on mobile/cellular
    location /downloads/ {
        alias /var/www/downloads/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # Direct file streaming
        sendfile on;
        sendfile_max_chunk 2m;
        tcp_nopush on;

        # Disable gzip compression for pre-compressed binaries (.exe, .dmg, .zip)
        gzip off;

        # Force download prompt in browsers
        add_header Content-Disposition 'attachment';
        add_header Accept-Ranges bytes;
        add_header Cache-Control 'public, max-age=3600, must-revalidate';

        # Allow CORS if downloaded from external origins
        add_header Access-Control-Allow-Origin *;
    }

    # Vanity shortcut download URLs (1-click direct downloads)
    location = /download/windows {
        default_type application/octet-stream;
        rewrite ^ /downloads/Attendly%20Setup%201.1.2.exe permanent;
    }

    location = /download/mac-arm64 {
        default_type application/octet-stream;
        rewrite ^ /downloads/Attendly-1.1.2-arm64.dmg permanent;
    }

    location = /download/mac-intel {
        default_type application/octet-stream;
        rewrite ^ /downloads/Attendly-1.1.2.dmg permanent;
    }

    location = /download/mac {
        default_type application/octet-stream;
        rewrite ^ /downloads/Attendly-1.1.2-arm64.dmg permanent;
    }

    location = /download/linux {
        default_type application/octet-stream;
        rewrite ^ /downloads/Attendly-1.1.2.AppImage permanent;
    }

    location = /download/deb {
        default_type application/octet-stream;
        rewrite ^ /downloads/attendly_1.1.2_amd64.deb permanent;
    }

    # --------------------------------------------------------------------------
    # 2. Next.js Static Optimization & Caching
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://attendly_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # 3. Next.js Application & WebSocket Reverse Proxy
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://attendly_backend;
        proxy_http_version 1.1;

        # Pass through original headers for client IP and SSL detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support for live attendance QR codes & Server-Sent Events
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering for real-time SSE streams
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
