# ==============================================================================
# Attendly — Nginx Reverse Proxy Configuration
# Routes all incoming LAN Wi-Fi & local traffic to the application container
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream attendly_backend {
        server attendly:3000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Standard proxy headers for real client identification
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket & Server-Sent Events (SSE) support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Streaming endpoints (/api/sessions/[id]/stream) - disable buffering
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        location / {
            proxy_pass http://attendly_backend;
        }

        # Health check endpoint for proxy verification
        location /proxy-health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }
    }
}
