# ============================================================================
# Attendly — Build Desktop Installers (Windows, macOS, Linux)
# ============================================================================
# Triggers on push to main with a version tag, or manually via workflow_dispatch.
# Produces NSIS installer (.exe), macOS DMG (.dmg), and Linux AppImage.
# Artifacts are uploaded to the GitHub Release automatically.

name: Build Desktop Installers

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: 'Upload artifacts to GitHub Release?'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            artifact_glob: '*.exe'
          - os: macos-latest
            platform: mac
            artifact_glob: '*.dmg'
          - os: ubuntu-latest
            platform: linux
            artifact_glob: '*.AppImage'

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js standalone
        run: npm run build

      - name: Prepare standalone assets
        run: node scripts/prepare-standalone.js

      - name: Build Electron installer (${{ matrix.platform }})
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac --arm64 --x64 --publish never
          else
            npx electron-builder --${{ matrix.platform }} --publish never
          fi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: attendly-${{ matrix.platform }}
          path: |
            release/${{ matrix.artifact_glob }}
            release/*.pkg
            release/*.zip
            release/*.blockmap
            release/latest*.yml
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_release == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
